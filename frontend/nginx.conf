server_tokens off;

# ---------- Límites de pedidos por IP ----------
# Uso normal: la app hace unos 15 pedidos al abrir una pantalla, muy lejos de estos topes.
# Sirven para frenar a un script que martille la API (adivinar contraseñas, saturar el OCR).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;   # ingreso (también con Google), registro, contraseña y códigos de email
limit_req_zone $binary_remote_addr zone=heavy:10m rate=30r/m;  # OCR, importación y exportaciones
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Pedidos chicos por defecto; solo las rutas que reciben archivos aceptan más (ver abajo).
    client_max_body_size 1m;
    # Conexiones que mandan los datos a cuentagotas (ataque "slowloris") se cortan.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 30s;
    proxy_read_timeout 60s;
    limit_conn perip 40;

    # DNS interno de Docker: al recrear el backend cambia su IP; sin esto la API da 502
    # hasta reiniciar nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Las respuestas de error de nginx en la API también son JSON (la app muestra "detail").
    error_page 429 = @too_many;
    error_page 413 = @too_large;

    location @too_many {
        include /etc/nginx/security-headers.conf;
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"detail":"Demasiados pedidos seguidos. Esperá unos segundos y volvé a probar."}';
    }

    location @too_large {
        include /etc/nginx/security-headers.conf;
        default_type application/json;
        return 413 '{"detail":"El archivo o los datos enviados son demasiado grandes."}';
    }

    location /api/ {
        limit_req zone=api burst=80 nodelay;
        include /etc/nginx/api-proxy.conf;
    }

    # Ingreso, registro, cambio de contraseña, ingreso con Google y códigos de email: además del
    # límite del backend, nginx frena ráfagas desde una misma IP.
    location ~ ^/api/v1/(auth/(login|register|password|google/.*)|notifications/email(/confirm)?)$ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/api-proxy.conf;
    }

    # Subir una factura: hasta 15 MB (como MAX_UPLOAD_MB del backend, más el margen del formulario).
    location = /api/v1/invoices/analyze {
        client_max_body_size 16m;
        limit_req zone=heavy burst=10 nodelay;
        include /etc/nginx/api-proxy.conf;
        proxy_read_timeout 120s;  # el OCR de fotos grandes puede demorar
    }

    # Extracto bancario: hasta 5 MB.
    location = /api/v1/imports/preview {
        client_max_body_size 6m;
        limit_req zone=heavy burst=10 nodelay;
        include /etc/nginx/api-proxy.conf;
    }

    # Exportaciones que arman un ZIP con todos los archivos.
    location ~ ^/api/v1/(export/full\.zip|reports/fiscal\.zip)$ {
        limit_req zone=heavy burst=10 nodelay;
        include /etc/nginx/api-proxy.conf;
        proxy_read_timeout 120s;
    }

    # Archivos con hash en el nombre: caché larga
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker: siempre se revisa si hay una versión nueva.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'" always;
        try_files $uri =404;
    }

    # "Compartir → Factura" lo atiende el service worker. Si todavía no está instalado,
    # el navegador hace un POST real: se lo manda a la pantalla de facturas.
    location = /share-target {
        include /etc/nginx/security-headers.conf;
        client_max_body_size 16m;
        return 303 /facturas;
    }

    # Aplicación de una sola página
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
