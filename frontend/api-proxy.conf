# Reenvío al backend, común a todas las rutas de la API. Se incluye en cada location de /api/
# (en nginx, una location que define sus propias directivas no hereda las de otra).
include /etc/nginx/security-headers.conf;
# Con una variable, nginx resuelve "backend" en cada pedido (ver resolver en nginx.conf)
# y no se queda con la IP vieja cuando se recrea el contenedor del backend.
set $backend_url http://backend:8000;
proxy_pass $backend_url;
proxy_http_version 1.1;
# Host tal como lo escribió el navegador, CON el puerto (APP_PORT): el ingreso con Google arma con
# él la dirección de vuelta, que tiene que coincidir exacto con la registrada en Google.
# ALLOWED_HOSTS ignora el puerto al comparar.
proxy_set_header Host $http_host;
# Se reemplazan (no se agregan) para que el cliente no pueda falsear su IP
# y saltarse el límite de intentos de inicio de sesión.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# (proxy_read_timeout se define a nivel del server; las rutas lentas lo amplían.)
