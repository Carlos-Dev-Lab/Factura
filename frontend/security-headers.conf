# Cabeceras de seguridad comunes. Se incluyen en CADA location: en nginx, si un bloque
# define su propio add_header, deja de heredar los del nivel superior.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
